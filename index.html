<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fab Progress">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fab Order Progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap">
<style>
/* Layout: brand header, add-truck bar, truck selector (up to 8), then the selected truck's Welding and Cut & Fab sections stacked. Single dark look on purpose: ORO's white+gold logo lives on black/charcoal. */
:root{
  --gold:#FFC425; --black:#121212; --charcoal:#303133; --gray:#F2F2F2; --white:#FFFFFF;
  --steel:#1b1c1e; --line:#3a3b3e; --dim:#9b9da2; --warn:#ff8a7a;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--black);color:var(--white);font-family:var(--font);font-weight:300;font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font-family:var(--font)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cap{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand img{height:52px;width:auto;display:block}
.brand .div{border-left:1px solid var(--line);padding-left:18px}
.brand .div b{display:block;font-weight:700;font-size:20px;line-height:1.1}
.brand .div span{font-size:12px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.sync{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:#55575b;display:block}
.sync.live i{background:var(--gold)}

/* add truck */
.add{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--steel);border:1px solid var(--line);border-radius:10px;padding:14px}
.add label{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.add input{font:400 15px var(--font);padding:10px 12px;border-radius:6px;background:var(--black);border:1px solid var(--line);color:var(--white);min-width:0;text-transform:uppercase}
.add input:focus{border-color:var(--gold);outline:none}
.add .slots{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.dots{display:flex;gap:4px}
.dots span{width:12px;height:18px;background:#3f4044;transform:skewX(-20deg)}
.dots span.on{background:var(--gold)}
.btn{font-weight:600;font-size:13px;padding:11px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--steel);color:var(--white);white-space:nowrap}
.btn.primary{background:var(--gold);color:var(--black);border-color:var(--gold)}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:#5a1f19;border-color:var(--warn);color:var(--white)}
.msg{flex-basis:100%;font-size:13px;color:var(--warn);min-height:0}
.msg:empty{display:none}

/* truck selector */
.trucks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.trucks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tk{text-align:left;cursor:pointer;background:var(--steel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--white);display:flex;flex-direction:column;gap:8px;min-width:0}
.tk:hover{border-color:#5a5c60}
.tk[aria-pressed="true"]{border-color:var(--gold);background:#2a2618}
.tk .so{font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.tk .bm{font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:56px minmax(0,1fr) 36px;gap:6px;align-items:center;font-size:11px;color:var(--dim)}
.mini .track{height:6px;background:#3f4044;border-radius:3px;overflow:hidden}
.mini .track div{height:100%;background:var(--gold);transition:width .3s}
.mini b{font-weight:700;color:var(--white);text-align:right;font-variant-numeric:tabular-nums}

.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{font-weight:600;font-size:18px}
.empty p{margin:0;color:var(--dim);max-width:46ch}

/* job */
.job{display:flex;flex-direction:column;gap:14px}
.jobhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.jobhead h2{margin:0;font-weight:700;font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.jobhead h2 span{color:var(--dim);font-weight:400;font-size:16px;margin-left:8px}
.jobhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--charcoal)}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--gold) 0 12px,var(--black) 12px 24px)}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px 0}
.ptitle h3{margin:0;font-weight:700;font-size:18px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;padding:14px 22px 22px}
@media (max-width:780px){.grid{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.st{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;cursor:pointer;user-select:none;border:1px solid var(--line);background:var(--steel);transition:background .15s,border-color .15s}
.st:hover{border-color:#5a5c60}
.st input{position:absolute;opacity:0;width:1px;height:1px}
.st:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.st:has(input:disabled){cursor:default}
.num{width:32px;height:32px;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid #55575b;color:var(--dim);transition:.15s;clip-path:polygon(22% 0,100% 0,78% 100%,0 100%)}
.num svg{width:15px;height:15px;display:none}
.st.on .num{background:var(--gold);border-color:var(--gold);color:var(--black)}
.st.on .num span{display:none}.st.on .num svg{display:block}
.name{font-weight:600;font-size:15px;line-height:1.25}
.name small{display:block;font-weight:300;font-size:12px;color:var(--dim)}
.w{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--dim)}
.st.on{border-color:var(--gold);background:#2a2618}
.st.on .w{color:var(--gold)}
.st.next{border-style:dashed;border-color:#7a7c80}
.st.next .name small::after{content:" · Next up";color:var(--gold);font-weight:600}
.side{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-width:0}
.gauge{position:relative;width:min(220px,100%);aspect-ratio:1}
.gauge svg{width:100%;height:100%;display:block}
.gauge .c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center}
.pct{font-weight:800;font-size:56px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pct sup{font-size:.4em;font-weight:700;vertical-align:.9em;margin-left:2px}
.slashes{display:flex;gap:4px;width:min(280px,100%);height:22px}
.slashes div{background:#3f4044;transform:skewX(-20deg);transition:background .2s;min-width:4px}
.slashes div.on{background:var(--gold)}
.chip{font-size:12px;font-weight:600;letter-spacing:.04em;padding:6px 14px;border-radius:999px;background:var(--black);color:var(--gray);text-align:center}
.chip.done{background:var(--gold);color:var(--black)}
.note{font-size:13px;color:var(--dim);background:var(--steel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.note:empty{display:none}
.foot{font-size:12px;color:var(--dim);text-align:center;padding-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--black);font-weight:600;padding:10px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:5}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

      <div class="div"><b>Fab Order Progress</b><span>Welding · Cut &amp; Fab</span></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="sync" id="sync"><i></i><span>Loading…</span></div>
      <button class="btn" id="exportBtn" type="button">Export backup</button>
      <button class="btn" id="importBtn" type="button">Import backup</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <label class="cap" for="so">Sales Order #<input id="so" placeholder="e.g. SO-104522" maxlength="40" required></label>
    <label class="cap" for="bm">BM #<input id="bm" placeholder="e.g. BM-2231" maxlength="40" required></label>
    <div class="slots"><span class="cap" id="slotText">0 of 8 trucks</span><div class="dots" id="dots"></div></div>
    <button class="btn primary" id="addBtn" type="submit">Add truck</button>
    <div class="msg" id="addMsg" role="alert"></div>
  </form>

  <div class="note" id="note"></div>
  <div class="trucks" id="trucks"></div>
  <div id="jobArea"></div>
  <div class="foot">ORO Design &amp; Manufacturing · Oro-Medonte, ON</div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const MAX=8;
const DEPTS=[
  {key:"welding",label:"Welding",stations:[
    {n:"Sub Structure",w:14},{n:"Side Packs",w:27},{n:"Crane Box",w:8},{n:"Sub-Bumper",w:8},
    {n:"Sub-Endpack and Hitch",w:1},{n:"Final Weld #1",w:24},{n:"Final Weld #2",w:17},{n:"Complete",w:1}]},
  {key:"cutfab",label:"Cut & Fab",stations:[
    {n:"CNC",w:30},{n:"Paint Prep",w:30},{n:"Saw",w:10},{n:"Press Brake",w:29},{n:"Complete",w:1}]}
];
DEPTS.forEach(d=>{let c=0;d.stations.forEach(s=>{c+=s.w;s.c=c})});
const tick='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let jobs=[];            // [{id, so, bm, created, welding:[i], cutfab:[i]}]
let selected=null;
let canWrite=true;
const KEY="fab-order-progress-v1";
let storeOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(jobs));storeOk=true}catch(e){storeOk=false;$("note").textContent="This browser isn't letting the page save. Trucks will be lost when the app closes. Use Export backup to keep a copy."}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v.slice(0,MAX):[]}catch(e){storeOk=false;return[]}}

function pct(job,d){const set=new Set(job[d.key]||[]);return d.stations.reduce((a,s,i)=>a+(set.has(i)?s.w:0),0)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}
function setSync(text,live){const s=$("sync");s.classList.toggle("live",!!live);s.querySelector("span").textContent=text}


/* ---------- rendering ---------- */
function renderSlots(){
  $("slotText").textContent=`${jobs.length} of ${MAX} trucks`;
  $("dots").innerHTML=Array.from({length:MAX},(_,i)=>`<span class="${i<jobs.length?"on":""}"></span>`).join("");
  const full=jobs.length>=MAX;
  $("addBtn").disabled=full||!canWrite;
  $("so").disabled=$("bm").disabled=!canWrite;
  $("addMsg").textContent=full&&canWrite?"All 8 truck slots are in use. Remove a finished truck to add a new one.":"";
}

function renderTrucks(){
  if(!jobs.length){
    $("trucks").innerHTML="";
    $("jobArea").innerHTML=`<div class="empty"><b>No trucks on the board yet</b><p>Enter a Sales Order # and BM # above and choose Add truck. Each truck gets its own Welding and Cut &amp; Fab tracker, and up to 8 trucks can be tracked at once.</p></div>`;
    return;
  }
  $("trucks").innerHTML=jobs.map(j=>`
    <button class="tk" data-id="${esc(j.id)}" aria-pressed="${j.id===selected}">
      <span><span class="so">${esc(j.so)}</span><br><span class="bm">BM ${esc(j.bm)}</span></span>
      ${DEPTS.map(d=>{const p=pct(j,d);return `<span class="mini"><span>${d.label}</span><span class="track"><div style="width:${p}%"></div></span><b>${p}%</b></span>`}).join("")}
    </button>`).join("");
}

function gaugeTicks(d){return d.stations.slice(0,-1).map(s=>{const a=(s.c/100)*2*Math.PI-Math.PI/2;return `<line x1="${(100+92*Math.cos(a)).toFixed(1)}" y1="${(100+92*Math.sin(a)).toFixed(1)}" x2="${(100+97*Math.cos(a)).toFixed(1)}" y2="${(100+97*Math.sin(a)).toFixed(1)}" stroke="#9b9da2" stroke-width="2"/>`}).join("")}

function section(job,d){
  const set=new Set(job[d.key]||[]),p=pct(job,d),done=p>=100;
  const nextI=d.stations.findIndex((s,i)=>!set.has(i));
  const status=done?d.label+" complete":p===0?"Not started":"In progress · Next: "+d.stations[nextI].n;
  return `<section class="panel">
    <div class="stripe"></div>
    <div class="ptitle"><h3>${d.label}</h3><span class="cap">${set.size} of ${d.stations.length} stations done</span></div>
    <div class="grid">
      <div class="list" data-dept="${d.key}">${d.stations.map((s,i)=>`
        <label class="st ${set.has(i)?"on":""} ${!done&&p>0&&i===nextI?"next":""}">
          <input type="checkbox" id="${esc(job.id)}-${d.key}-${i}" data-i="${i}" ${set.has(i)?"checked":""} ${canWrite?"":"disabled"} aria-label="${s.n}">
          <span class="num"><span>${i+1}</span>${tick}</span>
          <span class="name">${s.n}<small>${s.c}% cumulative</small></span>
          <span class="w">+${s.w}%</span>
        </label>`).join("")}</div>
      <div class="side">
        <div class="gauge">
          <svg viewBox="0 0 200 200" aria-hidden="true">${gaugeTicks(d)}
            <circle cx="100" cy="100" r="78" fill="none" stroke="#3f4044" stroke-width="16"/>
            <circle cx="100" cy="100" r="78" fill="none" stroke="#FFC425" stroke-width="16" stroke-dasharray="490.09" stroke-dashoffset="${(490.09*(1-p/100)).toFixed(2)}" transform="rotate(-90 100 100)"/>
          </svg>
          <div class="c"><span class="cap">${d.label}</span><div class="pct">${p}<sup>%</sup></div></div>
        </div>
        <div class="slashes" aria-hidden="true">${d.stations.map((s,i)=>`<div class="${set.has(i)?"on":""}" style="flex:${s.w}" title="${s.n} · ${s.w}%"></div>`).join("")}</div>
        <div class="chip ${done?"done":""}">${esc(status)}</div>
      </div>
    </div>
  </section>`;
}

function renderJob(){
  const job=jobs.find(j=>j.id===selected);
  if(!job){if(jobs.length)$("jobArea").innerHTML="";return}
  const added=job.created?new Date(job.created).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"";
  $("jobArea").innerHTML=`<div class="job">
    <div class="jobhead">
      <div><div class="cap">Sales Order${added?" · added "+added:""}</div><h2>${esc(job.so)}<span>BM ${esc(job.bm)}</span></h2></div>
      <div class="acts">
        <button class="btn" id="copyBtn">Copy summary</button>
        ${canWrite?`<button class="btn danger" id="removeBtn">Remove truck</button>`:""}
      </div>
    </div>
    ${DEPTS.map(d=>section(job,d)).join("")}
  </div>`;
}

function renderAll(){
  if(jobs.length&&!jobs.some(j=>j.id===selected))selected=jobs[0].id;
  if(!jobs.length)selected=null;
  renderSlots();renderTrucks();if(jobs.length)renderJob();
}

/* ---------- events ---------- */
$("trucks").addEventListener("click",e=>{const b=e.target.closest(".tk");if(!b)return;selected=b.dataset.id;renderTrucks();renderJob()});

$("jobArea").addEventListener("change",e=>{
  const inp=e.target;if(!inp.matches("input[type=checkbox]"))return;
  const job=jobs.find(j=>j.id===selected);if(!job)return;
  const key=inp.closest("[data-dept]").dataset.dept,i=+inp.dataset.i;
  const set=new Set(job[key]||[]);inp.checked?set.add(i):set.delete(i);
  job[key]=[...set].sort((a,b)=>a-b);
  renderTrucks();renderJob();
  const focusId=inp.id;const el=document.getElementById(focusId);if(el)el.focus();
  save();
});

$("jobArea").addEventListener("click",e=>{
  const job=jobs.find(j=>j.id===selected);if(!job)return;
  if(e.target.id==="copyBtn"){
    const lines=[`Sales Order ${job.so} · BM ${job.bm}`];
    DEPTS.forEach(d=>{const set=new Set(job[d.key]||[]);lines.push(`${d.label}: ${pct(job,d)}%`,`  Done: ${d.stations.filter((s,i)=>set.has(i)).map(s=>s.n).join(", ")||"none"}`,`  Remaining: ${d.stations.filter((s,i)=>!set.has(i)).map(s=>s.n).join(", ")||"none"}`)});
    try{navigator.clipboard.writeText(lines.join("\n")).then(()=>toast("Summary copied"),()=>toast("Copy isn't allowed here"))}catch(err){toast("Copy isn't allowed here")}
  }
  if(e.target.id==="removeBtn"){
    const b=e.target;
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Tap again to remove";clearTimeout(b._t);b._t=setTimeout(()=>{b.classList.remove("armed");b.textContent="Remove truck"},4000);return}
    const id=job.id;jobs=jobs.filter(j=>j.id!==id);selected=null;renderAll();toast("Truck removed");
    save();
  }
});

$("addForm").addEventListener("submit",e=>{
  e.preventDefault();
  const so=$("so").value.trim().toUpperCase(),bm=$("bm").value.trim().toUpperCase();
  if(!so||!bm){$("addMsg").textContent="Enter both a Sales Order # and a BM #.";return}
  if(jobs.length>=MAX){$("addMsg").textContent="All 8 truck slots are in use. Remove a finished truck to add a new one.";return}
  if(jobs.some(j=>j.so===so&&j.bm===bm)){$("addMsg").textContent=`${so} / BM ${bm} is already on the board.`;return}
  const job={so,bm,created:Date.now(),welding:[],cutfab:[]};
  job.id="t"+Date.now().toString(36);
  jobs.push(job);save();
  selected=job.id;$("so").value="";$("bm").value="";renderAll();toast("Truck added");
});

/* ---------- storage ---------- */
jobs=load();
setSync(storeOk?"Saved on this device":"Not saving",storeOk);
renderAll();

$("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({app:"fab-order-progress",version:1,exported:new Date().toISOString(),jobs},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="Fab-Order-Progress-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Backup downloaded");
});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);const list=Array.isArray(d)?d:d.jobs;
    if(!Array.isArray(list))throw 0;
    jobs=list.filter(j=>j&&j.so&&j.bm).slice(0,MAX).map(j=>({id:j.id||("t"+Math.random().toString(36).slice(2)),so:String(j.so),bm:String(j.bm),created:j.created||Date.now(),welding:Array.isArray(j.welding)?j.welding:[],cutfab:Array.isArray(j.cutfab)?j.cutfab:[]}));
    selected=null;save();renderAll();toast("Backup restored");
  }catch(err){toast("That file isn't an ORO progress backup")}
  e.target.value="";};
  r.readAsText(f);
});

if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
